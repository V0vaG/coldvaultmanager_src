{% extends "layout.html" %}
{% block content %}
  <h2>קבצי גרסה</h2>

  <div class="card" style="display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap">
    <div>תיקייה: <code>{{ fw_dir }}</code></div>

    <!-- Single upload button -->
    <form id="upload-form" method="post" enctype="multipart/form-data">
      <input id="fw-input" name="firmware_file" type="file" accept=".bin" style="display:none" />
      <button type="button" class="btn btn-primary" onclick="document.getElementById('fw-input').click()">
        העלה קובץ גרסה
      </button>
    </form>
  </div>

  <script>
    // Auto-submit when file chosen
    const fwInput = document.getElementById('fw-input');
    fwInput.addEventListener('change', function () {
      if (fwInput.files && fwInput.files.length > 0) {
        document.getElementById('upload-form').submit();
      }
    });
  </script>

  <div class="card">
    {% if items %}
      <table>
        <thead><tr>
          <th>קובץ</th><th>גרסה</th><th>גודל</th><th>עודכן</th>
        </tr></thead>
        <tbody>
          {% for it in items %}
            <tr>
              <td>{{ it.filename }}</td>
              <td>{{ it.version }}</td>
              <td>{{ it.size_h }}</td>
              <td class="muted">{{ it.mtime }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <div class="muted">אין קבצים תואמים.</div>
    {% endif %}
  </div>
{% endblock %}
